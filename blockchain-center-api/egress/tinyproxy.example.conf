# tinyproxy config for ONE egress proxy. Run one container per egress IP, each
# with its own copy of this file differing only in `Port` and `Bind`.
#
# Security: this proxy runs with network_mode: host on a server that has PUBLIC
# IPs. Without the Allow ACL below it would be an OPEN forward proxy to the whole
# internet. Keep `Allow` restricted to the Docker bridge subnet(s) of the app
# container and localhost only.

# Port to LISTEN on (host port, since the container uses network_mode: host).
# Use a distinct port per proxy instance, e.g. 8881 and 8882.
Port 8881

# Source IP for OUTGOING connections — this is what makes egress go out a
# specific NIC (combined with the host source-based policy routing). Set to the
# LAN IP of the NIC you want, e.g. 10.0.0.101 (enp3s0) or 10.0.0.102 (eno1).
Bind 10.0.0.101

# Who may use this proxy. Restrict to localhost + Docker bridge ranges only.
Allow 127.0.0.1
Allow 172.16.0.0/12

# Allow CONNECT tunnels to HTTPS (RPC endpoints are all https).
ConnectPort 443
ConnectPort 8443

Timeout 600
MaxClients 200
StartServers 5
LogLevel Warning
