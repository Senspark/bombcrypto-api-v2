<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deploy Status</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; padding: 32px 20px; background: #14161a; color: #e6e8eb;
               font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
        .sub { color: #8b929c; font-size: 12px; margin-bottom: 24px; }
        .warn { color: #ffc46b; }
        .card { background: #1c1f24; border: 1px solid #2a2e35; border-radius: 8px;
                padding: 16px 18px; margin-bottom: 12px; }
        .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .name { font-weight: 600; font-size: 15px; }
        .muted { color: #8b929c; font-size: 12px; }
        .badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
                 padding: 3px 8px; border-radius: 999px; }
        .IDLE     { background: #2a2e35; color: #9aa2ad; }
        .BUILDING { background: #2b3a55; color: #7fb0ff; }
        .SUCCESS  { background: #1e3a2b; color: #6ee7a0; }
        .FAILED   { background: #45211f; color: #ff8b80; }
        .runs { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
        .runs th { text-align: left; font-weight: 500; color: #8b929c; font-size: 11.5px;
                   text-transform: uppercase; letter-spacing: .04em;
                   padding: 0 12px 6px 0; border-bottom: 1px solid #2a2e35; }
        .runs td { padding: 7px 12px 7px 0; border-bottom: 1px solid #23262c; vertical-align: top; }
        .runs tr:last-child td { border-bottom: 0; }
        .msg { color: #b8bec7; max-width: 340px; overflow-wrap: anywhere; }
        code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
        .empty { color: #8b929c; }
        .scroll { overflow-x: auto; }
    </style>
</head>
<body>
<main>
    <h1>Deploy Status</h1>
    <div class="sub" id="updated">loading...</div>
    <div id="sites"></div>
</main>
<script>
    // Author names and commit messages are written by whoever pushed, so nothing
    // that arrives here is ever trusted as markup.
    const esc = v => String(v).replace(/[&<>"']/g, c =>
        ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const shortSha = sha => sha ? sha.slice(0, 7) : '-';
    const when = ts => ts ? new Date(ts).toLocaleString() : '-';
    const took = ms => ms == null ? '-' : (ms / 1000).toFixed(1) + 's';

    function runs(history) {
        if (!history.length) return '<div class="muted" style="margin-top:14px">No builds recorded yet.</div>';
        return `<div class="scroll"><table class="runs">
            <thead><tr><th>Status</th><th>Commit</th><th>By</th><th>Message</th><th>Started</th><th>Took</th></tr></thead>
            <tbody>${history.map(r => `
                <tr>
                    <td><span class="badge ${esc(r.status)}">${esc(r.status)}</span></td>
                    <td><code>${shortSha(r.commit)}</code></td>
                    <td>${r.author ? esc(r.author) : '-'}</td>
                    <td class="msg">${r.commitMessage ? esc(r.commitMessage) : '-'}</td>
                    <td>${when(r.startedAt)}</td>
                    <td>${took(r.durationMs)}</td>
                </tr>`).join('')}</tbody>
        </table></div>`;
    }

    function render(sites) {
        if (!sites.length) {
            document.getElementById('sites').innerHTML = '<div class="card empty">No sites configured.</div>';
            return;
        }
        document.getElementById('sites').innerHTML = sites.map(s => `
            <div class="card">
                <div class="row">
                    <span class="name">${esc(s.name)}</span>
                    <span class="badge ${esc(s.status)}">${esc(s.status)}</span>
                    <span class="muted"><code>${esc(s.branch)}</code></span>
                </div>
                ${runs(s.history || [])}
            </div>`).join('');
    }

    async function refresh() {
        const updated = document.getElementById('updated');
        try {
            const res = await fetch('api/sites', {cache: 'no-store'});
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            render(data.sites);
            updated.textContent = 'Updated ' + new Date().toLocaleTimeString();
            // Without this the page would look merely quiet while the builder is
            // gone, which reads the same as nobody having pushed anything.
            updated.className = data.builderReachable ? 'sub' : 'sub warn';
            if (!data.builderReachable) {
                updated.textContent += ' - builder unreachable, this may be stale';
            }
        } catch (e) {
            updated.className = 'sub warn';
            updated.textContent = 'Cannot reach the API: ' + e.message;
        }
    }

    refresh();
    setInterval(refresh, 5000);
</script>
</body>
</html>
