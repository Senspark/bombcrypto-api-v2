networks:
  base_default:
    external: true
  web_deployer:
  web_builder:

name: bombcrypto
services:

  ap-rpc-api:
    build:
      context: ./rpc-api
      dockerfile: Dockerfile
    container_name: ap-rpc-api
    ports:
      - "8105:80"
    networks:
      - base_default
    env_file:
      - ./rpc-api/.env
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 80

  ap-th-server:
    build:
      context: ./th-mode-server
      dockerfile: Dockerfile
    container_name: ap-th-server
    ports:
      - "8106:80"
    networks:
      - base_default
    env_file:
      - ./th-mode-server/.env
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 80
      REDIS_CONNECTION_STRING: 'redis://@redis:6379/0'
      USE_MOCK_DATA: true
      REFRESH_INTERVAL: 5000

  ap-blockchain-center:
    build:
      context: ./blockchain-center-api
      dockerfile: Dockerfile
    container_name: ap-blockchain-center
    ports:
      - "8107:80"
    networks:
      - base_default
    environment:
      TZ: 'Asia/Bangkok'
      REDIS_CONNECTION_STRING: 'redis://@redis:6379/0'

  ap-share-on-x:
    build:
      context: ./share-on-x
      dockerfile: Dockerfile
    container_name: ap-share-on-x
    ports:
      - "8108:80"
    networks:
      - base_default
    env_file:
      - ./share-on-x/.env
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 80
      REDIS_CONNECTION_STRING: 'redis://@redis:6379/0'
      IMAGE_DIR: '/app/share-assets'
    # Bind-mount the image dir to the SAME host path nginx serves /share-img/ from
    # (plan §6/§7). Uncomment and set the host path at deploy:
    # volumes:
    #   - /host/path/share-assets:/app/share-assets
    
  # DEV-ONLY, TESTNET-ONLY. The editor-chain-proxy takes a throwaway private key
  # per request and sends arbitrary tx — it must NEVER be exposed off the dev
  # machine. Two guardrails keep it local: (1) the port is published to the host
  # loopback ONLY (127.0.0.1); (2) the code rejects any RPC whose real chainId is
  # not a whitelisted testnet (97 bsctestnet, 80002 amoy). Do not deploy this to a
  # shared/production host.
  ap-editor-chain-proxy:
    build:
      context: ./editor-chain-proxy
      dockerfile: Dockerfile
    container_name: ap-editor-chain-proxy
    ports:
      - "127.0.0.1:8555:8555"
    networks:
      - base_default
    env_file:
      - path: ./editor-chain-proxy/.env
        required: false
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 8555
      # Bind all interfaces INSIDE the container so the forwarded port reaches the
      # process; host exposure is still loopback-only via the ports mapping above.
      HOST: '0.0.0.0'

  ap-pay-rock-server:
    build:
      context: ./pay-rock-server
      dockerfile: Dockerfile
    container_name: ap-pay-rock-server
    ports:
      - "8110:80"
    networks:
      - base_default
    env_file:
      - path: ./pay-rock-server/.env
        required: false
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 80
      BLOCKCHAIN_API: 'http://ap-blockchain'
      REDIS_URL: 'redis://@redis:6379/0'
      DATABASE_URL: 'postgres://postgres:123456@postgres:5432/bombcrypto'
  # Holds the webhook secrets, the trigger signing key and the Slack url, and
  # never runs a line of site code. It is the only half reachable from nginx.
  ap-web-deployer:
    build:
      context: ./web-deployer
      dockerfile: Dockerfile
    container_name: ap-web-deployer
    command: ["node", "dist/Receiver.js"]
    ports:
      - "8111:80"
    networks:
      - web_deployer
      - web_builder
    env_file:
      - path: ./web-deployer/.env
        required: false
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 80
      SITES_FILE: '/config/sites.json'
      BUILDER_URL: 'http://ap-web-builder:80'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./web-deployer/sites.json:/config/sites.json:ro

  # Runs `npm ci` and `npm run build` for every site, which is to say it executes
  # whatever those repos contain. It therefore holds no secret worth taking: only
  # the PUBLIC trigger key, and only the web roots it must write.
  #
  # It is NOT on web_deployer, so it cannot reach nginx or anything else the
  # receiver can. Outbound internet stays open because git and npm need it.
  ap-web-builder:
    build:
      context: ./web-deployer
      dockerfile: Dockerfile
    container_name: ap-web-builder
    command: ["node", "dist/Builder.js"]
    # git clone/fetch spawn helpers of their own. When the parent git is killed
    # on timeout they are reparented to PID 1, and node never reaps a process it
    # did not spawn itself - they stay zombies for the life of the container.
    init: true
    networks:
      - web_builder
    env_file:
      - path: ./web-deployer/.env
        required: false
    environment:
      TZ: 'Asia/Bangkok'
      PORT: 80
      SITES_FILE: '/config/sites.json'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 512
    cpus: 2.0
    volumes:
      - ./web-deployer/sites.json:/config/sites.json:ro
      - web-deployer-repos:/data/repos
      - web-deployer-logs:/data/logs
      # One bind per site: the SAME host path must be mounted read-only into the
      # nginx container. Uncomment and set the real web root at deploy:
      # - /host/path/www/example-site:/publish/example-site

volumes:
  web-deployer-repos:
  web-deployer-logs:
