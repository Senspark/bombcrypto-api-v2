<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#242735" />
    <title>Bombcrypto TH Mode — Under Maintenance</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #242735;
        color: #f4f4f4;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px;
        background:
          radial-gradient(ellipse at top, rgba(173, 255, 47, 0.08), transparent 55%),
          radial-gradient(ellipse at bottom, rgba(0, 0, 0, 0.55), transparent 60%),
          #242735;
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 12% 22%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 28% 78%, rgba(255, 255, 255, 0.3), transparent),
          radial-gradient(1.5px 1.5px at 55% 18%, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1px 1px at 73% 65%, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1.5px 1.5px at 88% 30%, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 42% 92%, rgba(255, 255, 255, 0.3), transparent);
        animation: twinkle 4s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }

      .wordmark {
        margin-bottom: 36px;
        font-size: clamp(20px, 2.4vw, 26px);
        font-weight: 700;
        letter-spacing: 8px;
        color: #f4f4f4;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        z-index: 2;
      }

      .wordmark .accent {
        color: #adff2f;
      }

      .wordmark .divider {
        margin: 0 12px;
        color: rgba(244, 244, 244, 0.35);
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(38px, 7vw, 68px);
        font-weight: 800;
        letter-spacing: 6px;
        color: #adff2f;
        text-shadow:
          0 2px 0 rgba(0, 0, 0, 0.5),
          0 0 24px rgba(173, 255, 47, 0.35);
        z-index: 2;
      }

      p.tagline {
        margin: 0 0 8px;
        font-size: clamp(18px, 2.4vw, 24px);
        letter-spacing: 2px;
        color: #e6e6e6;
        z-index: 2;
      }

      p.sub {
        margin: 0;
        font-size: clamp(14px, 1.6vw, 18px);
        letter-spacing: 1.5px;
        color: rgba(244, 244, 244, 0.6);
        z-index: 2;
      }

      .footer {
        position: absolute;
        bottom: 16px;
        left: 0;
        right: 0;
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(244, 244, 244, 0.35);
        z-index: 2;
      }

      @media (max-width: 560px) {
        .wordmark { letter-spacing: 5px; margin-bottom: 24px; }
        .wordmark .divider { margin: 0 8px; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="stars" aria-hidden="true"></div>

      <div class="wordmark">
        <span class="accent">BOMBCRYPTO</span>
        <span class="divider">·</span>
        <span>TH MODE</span>
      </div>

      <h1>UNDER MAINTENANCE</h1>
      <p class="tagline">We're polishing the dashboard</p>
      <p class="sub">Coming back soon. Thanks for your patience, bomber!</p>

      <div class="footer">&copy; Bombcrypto TH Mode</div>
    </div>
  </body>
</html>
